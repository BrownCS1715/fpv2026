name = "LoVe"
defaultTargets = ["LoVe"]

[leanOptions]
autoImplicit = false
linter.unusedVariables = false 
linter.unusedTactic = false
linter.unreachableTactic = false

[[require]]
name = "autograder" 
git = "https://github.com/robertylewis/lean4-autograder-main" 
rev = "v4.33.0"

[[require]]
name = "mdgen"
git = "https://github.com/Seasawher/mdgen"
rev = "v4.33.0-rc2"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "LoVe"
